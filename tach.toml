# tach.toml — bounded-context isolation (HEX-31).
#
# One real capability today (projects, under core/), so this mostly restates
# the cli/web/core boundaries import-linter already guards; its value grows
# with a second bounded context, where per-context isolation + strict public
# interfaces (deny-internals-by-default) become the thing import-linter cannot
# express. Run via `uv run tach check` (wired into `just check`).
source_roots = ["src"]
exclude = [
  "tests",
  "init",
  "docs",
  "scripts",
  "build",
  "dist",
  ".venv",
]

[[modules]]
path = "blueprint_press_dryrun"
depends_on = []

[[modules]]
path = "blueprint_press_dryrun.core"
depends_on = ["blueprint_press_dryrun"]

[[modules]]
path = "blueprint_press_dryrun.composition"
depends_on = ["blueprint_press_dryrun.core"]

[[modules]]
path = "blueprint_press_dryrun.cli"
depends_on = ["blueprint_press_dryrun.composition", "blueprint_press_dryrun.core", "blueprint_press_dryrun"]

[[modules]]
path = "blueprint_press_dryrun.web"
depends_on = ["blueprint_press_dryrun.core", "blueprint_press_dryrun.composition", "blueprint_press_dryrun"]
